name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test CRM and security boundaries
        run: npm run test:crm

      - name: Test concierge behavior
        run: npm run test:concierge

      - name: Test commercial surfaces
        run: npm run test:commercial

      - name: Test Founder OS routing
        run: npm run test:dev-routing

      - name: Test current-state truth
        run: npm run test:now

      - name: Test migrations
        run: npm run test:migrations

      - name: Build
        run: npm run build

