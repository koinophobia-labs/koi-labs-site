name: Koi Visual Smoke

on:
  pull_request:
    paths:
      - app/page.tsx
      - app/layout.tsx
      - app/koi-scroll.css
      - app/koi-final.css
      - app/koi-depth.css
      - components/studio/KoiFinalHomepage.tsx
      - components/studio/ScrollKoiExperience.tsx
      - components/studio/KoiDepthPass.tsx
      - public/brand/koi-scroll-single.mp4
      - public/brand/koi-scroll-duo.mp4
      - scripts/capture-koi-visuals.mjs
      - .github/workflows/koi-visual-smoke.yml

permissions:
  contents: read

concurrency:
  group: koi-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          HOSTNAME=127.0.0.1 PORT=3000 npm run start > /tmp/koi-next.log 2>&1 &
          echo $! > /tmp/koi-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/koi-next.log
          exit 1

      - name: Capture final koi compositions
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/koi-chrome \
            about:blank \
            > /tmp/koi-chrome.log 2>&1 &
          echo $! > /tmp/koi-chrome.pid
          node scripts/capture-koi-visuals.mjs
          test "$(find artifacts/koi-visuals -name '*.png' | wc -l)" -eq 4

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: koi-visual-smoke-${{ github.sha }}
          path: artifacts/koi-visuals/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Print service logs on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/koi-next.log || true
          cat /tmp/koi-chrome.log || true

      - name: Stop local services
        if: always()
        shell: bash
        run: |
          test ! -f /tmp/koi-chrome.pid || kill "$(cat /tmp/koi-chrome.pid)" || true
          test ! -f /tmp/koi-next.pid || kill "$(cat /tmp/koi-next.pid)" || true
