name: Localize Koi Motion Assets

on:
  push:
    branches:
      - agent/scroll-koi-navigation
    paths:
      - .github/workflows/localize-koi-assets.yml

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out motion branch
        uses: actions/checkout@v4
        with:
          ref: agent/scroll-koi-navigation
          fetch-depth: 0

      - name: Download source renders
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://d8j0ntlcm91z4.cloudfront.net/user_3HhOHQGL0oXayVyXOmPdMu1Mdi2/hf_20260817_153612_85fd7589-b5dd-421b-a56c-758edb9c0556.mp4" \
            --output /tmp/koi-single-source.mp4
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://d8j0ntlcm91z4.cloudfront.net/user_3HhOHQGL0oXayVyXOmPdMu1Mdi2/hf_20260817_153625_90275ee1-76df-4c9c-852d-035bde6ab43a.mp4" \
            --output /tmp/koi-duo-source.mp4

      - name: Encode web delivery assets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p public/brand
          FILTER="scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black"
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/koi-single-source.mp4 -an -vf "$FILTER" -r 30 \
            -c:v libx264 -preset slow -crf 24 -maxrate 4M -bufsize 8M \
            -pix_fmt yuv420p -movflags +faststart \
            public/brand/koi-scroll-single.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/koi-duo-source.mp4 -an -vf "$FILTER" -r 30 \
            -c:v libx264 -preset slow -crf 24 -maxrate 4M -bufsize 8M \
            -pix_fmt yuv420p -movflags +faststart \
            public/brand/koi-scroll-duo.mp4
          test "$(stat -c%s public/brand/koi-scroll-single.mp4)" -lt 50000000
          test "$(stat -c%s public/brand/koi-scroll-duo.mp4)" -lt 50000000
          sha256sum \
            public/brand/koi-scroll-single.mp4 \
            public/brand/koi-scroll-duo.mp4 \
            > public/brand/koi-scroll-assets.sha256
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            public/brand/koi-scroll-single.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            public/brand/koi-scroll-duo.mp4

      - name: Commit owned site assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/brand/koi-scroll-single.mp4 \
            public/brand/koi-scroll-duo.mp4 \
            public/brand/koi-scroll-assets.sha256
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Localize koi motion assets [skip ci]"
          git push origin HEAD:agent/scroll-koi-navigation
