name: Refresh Final Koi Assets

on:
  push:
    branches:
      - agent/koi-anchor-renditions
    paths:
      - .github/workflows/refresh-final-koi-assets.yml
  pull_request:
    paths:
      - .github/workflows/refresh-final-koi-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out final branch
        uses: actions/checkout@v4
        with:
          ref: agent/koi-anchor-renditions
          fetch-depth: 0

      - name: Download and encode website-first koi films
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/koi-final artifacts/koi-final-contact-sheets public/brand

          curl --fail --location --retry 4 --retry-all-errors \
            "https://d8j0ntlcm91z4.cloudfront.net/user_3HhOHQGL0oXayVyXOmPdMu1Mdi2/hf_20260818_021556_755ff0b5-7c99-4754-b9fb-b2fc88a7d886.mp4" \
            --output /tmp/koi-final/navigation-raw.mp4

          curl --fail --location --retry 4 --retry-all-errors \
            "https://d8j0ntlcm91z4.cloudfront.net/user_3HhOHQGL0oXayVyXOmPdMu1Mdi2/hf_20260818_021623_92af66f0-5636-4d10-823e-8d6956fc666a.mp4" \
            --output /tmp/koi-final/products-raw.mp4

          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/koi-final/navigation-raw.mp4 \
            -an -vf "scale=1280:-2:flags=lanczos,fps=30" \
            -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p \
            -movflags +faststart \
            public/brand/koi-scroll-single.mp4

          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/koi-final/products-raw.mp4 \
            -an -vf "scale=1280:-2:flags=lanczos,fps=30" \
            -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p \
            -movflags +faststart \
            public/brand/koi-scroll-duo.mp4

          ffmpeg -hide_banner -loglevel error -y \
            -i public/brand/koi-scroll-single.mp4 \
            -vf "fps=1/2.5,scale=480:-2:flags=lanczos,tile=3x2:padding=8:margin=8" \
            -frames:v 1 artifacts/koi-final-contact-sheets/navigation-contact-sheet.png

          ffmpeg -hide_banner -loglevel error -y \
            -i public/brand/koi-scroll-duo.mp4 \
            -vf "fps=1/2.5,scale=480:-2:flags=lanczos,tile=3x2:padding=8:margin=8" \
            -frames:v 1 artifacts/koi-final-contact-sheets/products-contact-sheet.png

          (
            cd public/brand
            sha256sum koi-scroll-single.mp4 koi-scroll-duo.mp4 > koi-scroll-assets.sha256
          )

          for asset in public/brand/koi-scroll-single.mp4 public/brand/koi-scroll-duo.mp4; do
            test "$(file --brief --mime-type "$asset")" = "video/mp4"
            bytes="$(stat -c%s "$asset")"
            test "$bytes" -gt 100000
            test "$bytes" -lt 5000000
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 "$asset"
          done

      - name: Commit localized final films
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/brand/koi-scroll-single.mp4 \
            public/brand/koi-scroll-duo.mp4 \
            public/brand/koi-scroll-assets.sha256
          if git diff --cached --quiet; then
            echo "Final koi assets already match."
            exit 0
          fi
          git commit -m "Localize final website-first koi films"
          git push origin HEAD:agent/koi-anchor-renditions

      - name: Upload motion contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: final-koi-motion-contact-sheets-${{ github.sha }}
          path: artifacts/koi-final-contact-sheets/*.png
          if-no-files-found: error
          retention-days: 14
